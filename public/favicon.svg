<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="20" fill="#1C1C1E"/>

  <!-- Main large white shape: rounded rect rotated slightly, like an isometric face -->
  <rect x="13" y="13" width="53" height="64" rx="12"
    fill="white"
    transform="rotate(-7, 39, 45)"/>

  <!-- Small white diamond (rotated square) -->
  <rect x="61" y="57" width="26" height="26" rx="6"
    fill="white"
    transform="rotate(45, 74, 70)"/>
</svg>
